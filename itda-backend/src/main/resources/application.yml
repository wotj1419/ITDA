spring:
  profiles:
    active: local
    include: redis-streams
  application:
    name: itda-backend

server:
  forward-headers-strategy: framework

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itda.backend.auth.domain,com.itda.backend.asset.domain,com.itda.backend.job.domain,com.itda.backend.node.domain,com.itda.backend.project.domain,com.itda.backend.scene.domain,com.itda.backend.node.repository.dto,com.itda.backend.project.repository.dto,com.itda.backend.scenario.repository.dto,com.itda.backend.timeline.repository.dto
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}
  access-expiration: 86400000      # 1 day (24h)
  refresh-expiration: 604800000    # 7 days

file:
  upload-dir: ./uploads

job:
  execution:
    max-retry-count: 0  # 0 이하: 제한 없음 (수동 재시도 정책)
  streams:
    image-stream-key: ai:image
    video-stream-key: ai:video
    merge-stream-key: media:merge
    image-group: cg:ai-image
    video-group: cg:ai-video
    merge-group: cg:media-merge
    consumer-prefix: api-worker
    poll-timeout-ms: 1000
