spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itda_local?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-local.sql
      continue-on-error: false

ai:
  vertex:
    project-id: ${GCP_PROJECT_ID:project-c9b5454b-ea72-433a-be6}
    location: ${GCP_LOCATION:us-central1}
    api-version: ${AI_VERTEX_API_VERSION:v1}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    stub: ${GEMINI_STUB:${AI_GEMINI_STUB:false}}
    image-model: ${GEMINI_IMAGE_MODEL:${VERTEX_IMAGE_MODEL:gemini-2.5-flash-image}}
    sample-count: ${GEMINI_SAMPLE_COUNT:1}
    aspect-ratio: ${GEMINI_ASPECT_RATIO:}
    response-mime-type: ${GEMINI_RESPONSE_MIME_TYPE:}
    response-modalities: ${GEMINI_RESPONSE_MODALITIES:IMAGE}
    timeout-ms: ${GEMINI_TIMEOUT_MS:${VERTEX_IMAGE_TIMEOUT_MS:60000}}
  scenario:
    model-text: ${VERTEX_TEXT_MODEL:gemini-2.5-flash}
    timeout-ms: ${VERTEX_TIMEOUT_MS:60000}
  veo:
    stub: ${AI_VEO_STUB:false}
    model: ${VEO_MODEL:veo-3.1-generate-001}
    timeout-ms: ${VEO_TIMEOUT_MS:180000}
    poll-interval-ms: ${VEO_POLL_INTERVAL_MS:2000}

logging:
  level:
    com.itda: DEBUG
    org.springframework.security: DEBUG

storage:
  provider: ${STORAGE_PROVIDER:S3}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:ap-northeast-2}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    bucket: ${S3_BUCKET:itda-local}
    path-style: ${S3_PATH_STYLE:true}
    presign-expire-seconds: ${S3_PRESIGN_EXPIRE_SECONDS:3600}
