spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itda_local?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:ssafy}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-local.sql
      continue-on-error: false

logging:
  level:
    com.itda: DEBUG
    org.springframework.security: DEBUG
