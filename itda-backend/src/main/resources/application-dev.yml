spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itda_dev?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

spring.ai.vertex.ai.gemini:
  project-id: ${GCP_PROJECT_ID:}
  location: ${GCP_LOCATION:us-central1}

ai:
  gemini:
    stub: ${GEMINI_STUB:false}
    api-key: ${GEMINI_API_KEY:}
    image-model: ${GEMINI_IMAGE_MODEL:imagen-3.0-generate-001}
    sample-count: ${GEMINI_SAMPLE_COUNT:1}
    aspect-ratio: ${GEMINI_ASPECT_RATIO:}
    timeout-ms: ${GEMINI_TIMEOUT_MS:60000}
  scenario:
    model-text: ${VERTEX_TEXT_MODEL:}
    timeout-ms: ${VERTEX_TIMEOUT_MS:8000}

logging:
  level:
    com.itda: DEBUG
    org.springframework.security: DEBUG
