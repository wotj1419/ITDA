spring:
  datasource:
    url: jdbc:mysql://localhost:3306/itda_dev?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ai:
  vertex:
    project-id: ${GCP_PROJECT_ID:}
    location: ${GCP_LOCATION:us-central1}
    api-version: ${AI_VERTEX_API_VERSION:v1}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    stub: ${GEMINI_STUB:${AI_GEMINI_STUB:true}}
    image-model: ${GEMINI_IMAGE_MODEL:${VERTEX_IMAGE_MODEL:gemini-2.5-flash-image}}
    sample-count: ${GEMINI_SAMPLE_COUNT:1}
    aspect-ratio: ${GEMINI_ASPECT_RATIO:}
    response-mime-type: ${GEMINI_RESPONSE_MIME_TYPE:}
    response-modalities: ${GEMINI_RESPONSE_MODALITIES:IMAGE}
    timeout-ms: ${GEMINI_TIMEOUT_MS:${VERTEX_IMAGE_TIMEOUT_MS:180000}}
  scenario:
    model-text: ${VERTEX_TEXT_MODEL:}
    timeout-ms: ${VERTEX_TIMEOUT_MS:180000}
  veo:
    stub: ${AI_VEO_STUB:true}
    model: ${VEO_MODEL:veo-3.1-generate-001}
    timeout-ms: ${VEO_TIMEOUT_MS:180000}
    poll-interval-ms: ${VEO_POLL_INTERVAL_MS:2000}

logging:
  level:
    com.itda: DEBUG
    org.springframework.security: DEBUG
