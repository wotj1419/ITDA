spring:
  profiles:
    active: test
  application:
    name: itda-backend
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itda.backend
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-secret-key-for-testing-only-minimum-length-requirement
  access-expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.itda: DEBUG
