spring:
  application:
    name: itda-backend
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3306/itda_test?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.itda.backend
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: test-secret-key-for-testing-only-minimum-length-requirement
  access-expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.itda: INFO
    org.springframework: WARN
    org.springframework.messaging: WARN
    org.springframework.web.socket: WARN
    org.springframework.web.socket.messaging.StompSubProtocolHandler: ERROR
    org.springframework.web.socket.messaging.SubProtocolWebSocketHandler: ERROR
    org.springframework.web.socket.sockjs: ERROR
    org.springframework.data.redis: WARN
    org.springframework.boot.web.embedded.tomcat: WARN
    org.apache.catalina: WARN
    org.apache.coyote: WARN
