global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "api"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["itda-api:18080"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["itda-node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["itda-cadvisor:8080"]
