<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Studio - Hackathon Masterpiece</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-rose: #f43f5e;
            --brand-soft: #fff1f2;
            --surface-white: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
            background: #fdfbfc; /* 부드러운 화이트 톤 */
            color: #1e293b;
            -webkit-font-smoothing: antialiased;
        }

        /* 은은한 배경 광채: 과하지 않게 수정한 버전 */
        .subtle-glow {
            position: fixed;
            top: -5%;
            right: -5%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, rgba(244, 63, 94, 0.04) 0%, transparent 70%);
            z-index: -1;
            filter: blur(60px);
        }

        /* 프리미엄 카드 질감 */
        .premium-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(244, 63, 94, 0.08);
            box-shadow: 0 4px 20px -5px rgba(244, 63, 94, 0.05);
        }

        /* AI 매직 버튼: 우아한 강조 */
        .magic-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #fb7185 100%);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.2);
        }

        .magic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.3);
            filter: brightness(1.05);
        }

        /* 탭 내비게이션 */
        .tab-link {
            position: relative;
            transition: all 0.3s ease;
            color: #94a3b8;
        }

        .tab-link.active {
            color: #f43f5e;
            font-weight: 800;
        }

        .tab-link.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #f43f5e;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
        }

        /* 씬 카드 */
        .scene-item {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .scene-item:hover {
            border-color: #fda4af;
            transform: scale(1.01);
            box-shadow: 0 12px 30px -10px rgba(244, 63, 94, 0.1);
        }

        /* 프로그레스 디자인 */
        .bar-track {
            background: #f1f5f9;
            height: 6px;
            border-radius: 10px;
        }

        .bar-fill {
            background: #f43f5e;
            height: 100%;
            width: 35%;
            border-radius: 10px;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">
    <div class="subtle-glow"></div>

    <!-- Sidebar: Sophisticated White -->
    <aside class="w-20 bg-white border-r border-slate-100 flex flex-col items-center py-10 gap-10 z-30">
        <div class="w-11 h-11 bg-slate-900 rounded-xl flex items-center justify-center text-white shadow-lg shadow-slate-200 cursor-pointer hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        
        <nav class="flex flex-col gap-5">
            <button class="p-3.5 rounded-2xl bg-rose-50 text-rose-500 shadow-sm transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></button>
            <button class="p-3.5 rounded-2xl text-slate-300 hover:text-slate-500 hover:bg-slate-50 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M7 3v18"/><path d="M17 3v18"/><path d="M3 7h4"/><path d="M3 12h4"/><path d="M3 17h4"/><path d="M17 7h4"/><path d="M17 12h4"/><path d="M17 17h4"/></svg></button>
            <button class="p-3.5 rounded-2xl text-slate-300 hover:text-slate-500 hover:bg-slate-50 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></button>
        </nav>

        <button class="mt-auto p-4 rounded-full text-slate-200 hover:text-slate-400 transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></button>
    </aside>

    <!-- Main Workspace -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <!-- Header: Apple Style Minimalism -->
        <header class="h-16 px-10 flex items-center justify-between border-b border-slate-100 bg-white/70 backdrop-blur-md z-20">
            <div class="flex items-center gap-6">
                <button class="p-2 hover:bg-slate-50 rounded-full text-slate-400 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="flex items-center gap-3">
                    <h1 class="text-base font-extrabold tracking-tight text-slate-800">용사의 모험</h1>
                    <div class="w-px h-3 bg-slate-200"></div>
                    <span class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">Story Canvas</span>
                </div>
            </div>

            <div class="flex items-center gap-8">
                <div class="hidden md:flex items-center gap-4">
                    <div class="text-right">
                        <div class="text-[10px] font-black text-slate-400 uppercase tracking-tighter">Production Progress</div>
                        <div class="w-32 bar-track mt-1.5">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center gap-2">
                    <button class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-50 border border-slate-200 transition-all">
                        협업 초대
                    </button>
                    <button class="px-5 py-1.5 rounded-lg text-xs font-black bg-rose-500 text-white hover:bg-rose-600 transition-all shadow-lg shadow-rose-100 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        PREVIEW
                    </button>
                </div>
            </div>
        </header>

        <!-- Body Area -->
        <div class="flex-1 overflow-y-auto p-10 max-w-5xl mx-auto w-full">
            
            <!-- Original Style Tabs -->
            <div class="flex gap-10 mb-10 border-b border-slate-100">
                <button class="pb-3 text-sm tab-link active">Story</button>
                <button class="pb-3 text-sm tab-link">Scenes</button>
                <button class="pb-3 text-sm tab-link">Objects</button>
            </div>

            <!-- AI Section: Integrated Magic -->
            <section class="mb-12 px-10 py-12 rounded-[2.5rem] premium-card flex flex-col items-center text-center relative overflow-hidden group">
                <div class="w-14 h-14 bg-white rounded-2xl shadow-sm border border-rose-50 flex items-center justify-center mb-6 group-hover:scale-105 transition-transform duration-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f43f5e" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                </div>
                
                <h2 class="text-2xl font-black text-slate-800 mb-2 tracking-tight">AI 시나리오 자동 생성</h2>
                <p class="text-slate-400 text-sm max-w-sm mb-10 leading-relaxed font-medium">장르와 분위기를 바탕으로 AI가 최적의 스토리를 구성합니다. <br> 단 한 번의 클릭으로 창의성을 깨워보세요.</p>
                
                <button class="magic-btn px-10 py-3.5 rounded-2xl text-white font-black text-base flex items-center gap-3">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
                    AI 시나리오 생성
                </button>
            </section>

            <!-- Scenes Timeline -->
            <section class="space-y-6">
                <div class="flex items-center justify-between px-2">
                    <h3 class="text-lg font-black text-slate-800 tracking-tight flex items-center gap-2">
                        Scenes
                        <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full">1</span>
                    </h3>
                    <button class="text-rose-500 font-black text-xs hover:underline flex items-center gap-1.5 uppercase tracking-widest">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
                        Add Scene
                    </button>
                </div>

                <!-- Scene Card: Clean Timeline Style -->
                <div class="scene-item p-5 rounded-3xl flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="cursor-grab text-slate-200 hover:text-rose-300 transition-colors p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>
                        </div>
                        <div class="w-16 h-12 bg-rose-50/50 rounded-xl flex items-center justify-center border border-rose-100/30 overflow-hidden group/thumb">
                             <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fb7185" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                        </div>
                        <div class="space-y-0.5">
                            <div class="flex items-center gap-2">
                                <span class="text-[9px] font-black text-rose-500 uppercase tracking-widest">Scene 01</span>
                                <span class="text-[9px] font-bold text-slate-300 uppercase">Draft</span>
                            </div>
                            <h4 class="text-base font-bold text-slate-800">New Scene 1</h4>
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <button class="h-9 px-4 rounded-xl text-[11px] font-black text-slate-400 hover:text-slate-900 transition-all flex items-center gap-1.5">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            미리보기
                        </button>
                        <button class="h-9 px-5 rounded-xl text-[11px] font-black text-rose-500 border border-rose-100 hover:bg-rose-50 transition-all">
                            편집하기
                        </button>
                    </div>
                </div>

                <!-- Add Action: Minimalist & Inviting -->
                <button class="w-full py-10 border-2 border-dashed border-slate-100 rounded-[2.5rem] flex flex-col items-center justify-center gap-2 text-slate-300 hover:border-rose-100 hover:bg-rose-50/20 hover:text-rose-400 transition-all group">
                    <div class="w-10 h-10 rounded-full border border-dashed border-current flex items-center justify-center group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
                    </div>
                    <span class="text-xs font-bold tracking-tight">새로운 장면 추가</span>
                </button>
            </section>
        </div>

        <!-- Floating Command Center: Refined White Version -->
        <div class="fixed bottom-8 right-8 flex items-center gap-3 bg-white/80 backdrop-blur-2xl p-2 rounded-2xl shadow-2xl border border-white/50 z-40">
            <div class="flex items-center gap-2 px-4 py-2 bg-emerald-50 text-emerald-600 rounded-xl border border-emerald-100">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-black uppercase tracking-widest">Live Studio</span>
            </div>
            <div class="flex items-center gap-1 pr-1">
                <button class="p-2.5 text-slate-300 hover:text-slate-600 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg></button>
                <button class="p-2.5 text-slate-300 hover:text-slate-600 transition-all"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
                <button class="p-2.5 text-slate-300 hover:text-slate-600 transition-all relative">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    <span class="absolute top-2.5 right-2.5 w-1.5 h-1.5 bg-rose-500 rounded-full"></span>
                </button>
            </div>
        </div>
    </main>

</body>
</html>
