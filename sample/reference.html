<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Movie Studio - Original Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --soft-pink: #FF4D8D;
            --light-pink: #FFF0F5;
            --bg-gray: #FAFAFB;
            --node-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 2px 8px rgba(0, 0, 0, 0.02);
            --active-shadow: 0 0 0 1px rgba(255, 77, 141, 0.1), 0 20px 40px -10px rgba(255, 77, 141, 0.2);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans KR', sans-serif;
            background-color: var(--bg-gray);
            color: #2D3139;
            letter-spacing: -0.01em;
        }

        /* 샘플 이미지의 핑크 도트 격자 배경 */
        .canvas-bg {
            background-image: radial-gradient(#FFD6E5 1.5px, transparent 1.5px);
            background-size: 30px 30px;
        }

        /* 럭셔리 소프트 카드 */
        .soft-card {
            background: #ffffff;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 214, 229, 0.5);
            box-shadow: var(--node-shadow);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        /* 활성화된 마스터 노드 디자인 (샘플 기반 강화) */
        .master-node-active {
            border: 2px solid var(--soft-pink);
            box-shadow: var(--active-shadow);
            background: linear-gradient(to bottom right, #ffffff, #FFF9FB);
        }

        .active-badge {
            background: var(--soft-pink);
            color: white;
            font-size: 11px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 99px;
            box-shadow: 0 4px 10px rgba(255, 77, 141, 0.3);
        }

        /* 데이터 플로우 애니메이션 (톤 조절) */
        .connector-line {
            width: 2px;
            background: #FFD6E5;
            position: relative;
            overflow: hidden;
        }

        .connector-line::after {
            content: '';
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 60%;
            background: linear-gradient(to bottom, transparent, var(--soft-pink), transparent);
            animation: flowDown 3s infinite ease-in-out;
        }

        @keyframes flowDown {
            0% {
                top: -60%;
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* 버튼 및 인터랙션 */
        .btn-pink {
            background-color: var(--soft-pink);
            transition: all 0.3s ease;
        }

        .btn-pink:hover {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(255, 77, 141, 0.3);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #FFD6E5;
            border-radius: 10px;
        }

        /* Bento Style Sidebar */
        .bento-item {
            background: #FDFDFD;
            border: 1px solid #F1F1F5;
            border-radius: 1rem;
            transition: all 0.2s ease;
        }

        .bento-item:hover {
            border-color: var(--soft-pink);
            background: #FFF9FB;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">

    <!-- 상단 바: 샘플의 구성을 유지하되 폰트와 간격을 정밀화함 -->
    <header class="h-14 bg-white border-b border-gray-100 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-4">
            <button class="text-gray-400 hover:text-gray-900 transition-colors"><i data-lucide="menu"></i></button>
            <button class="text-gray-400 hover:text-gray-900 transition-colors"><i
                    data-lucide="arrow-left"></i></button>
            <div class="flex items-center text-sm font-medium">
                <span class="text-gray-400">AI Movie Studio</span>
                <span class="mx-2 text-gray-200">/</span>
                <span class="text-gray-400">해커톤 데모 프로젝트 1440</span>
                <span class="mx-2 text-gray-200">/</span>
                <span class="text-gray-900 font-bold">Scene 1: New Scene 1</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div class="bg-gray-50 text-[10px] font-bold px-2 py-1 rounded text-gray-400 border border-gray-100">100%
            </div>
            <button
                class="flex items-center gap-2 px-3 py-1.5 text-xs font-bold text-gray-600 hover:bg-gray-50 rounded-lg">
                <i data-lucide="layout" class="w-4 h-4 text-gray-400"></i> Scene Timeline
            </button>
            <button class="px-5 py-2 btn-pink text-white text-xs font-bold rounded-xl shadow-lg shadow-pink-100">
                Export Scene
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- 왼쪽 사이드 바 -->
        <aside class="w-16 border-r border-gray-100 bg-white flex flex-col items-center py-6 gap-6">
            <div
                class="w-10 h-10 bg-white border border-gray-100 rounded-xl flex items-center justify-center text-gray-400 hover:text-pink-500 hover:border-pink-200 transition-all cursor-pointer">
                <i data-lucide="book-open"></i>
            </div>
            <div
                class="w-10 h-10 bg-pink-50 border border-pink-100 rounded-xl flex items-center justify-center text-pink-500">
                <i data-lucide="film"></i>
            </div>
            <div
                class="w-10 h-10 bg-white border border-gray-100 rounded-xl flex items-center justify-center text-gray-400 hover:text-pink-500 transition-all cursor-pointer">
                <i data-lucide="layers"></i>
            </div>
        </aside>

        <!-- 메인 프로덕션 캔버스 -->
        <main class="flex-1 relative canvas-bg overflow-hidden">
            <div class="absolute inset-0 flex flex-col items-center justify-center p-20">

                <!-- [노드 1] 씬 정보 카드 -->
                <div class="soft-card w-[420px] p-8 relative">
                    <div class="flex items-start gap-4">
                        <div
                            class="w-10 h-10 rounded-xl bg-pink-50 flex items-center justify-center text-pink-500 border border-pink-100">
                            <i data-lucide="book"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="text-lg font-bold text-gray-800 tracking-tight">씬 1: New Scene 1</h3>
                            <p class="text-sm text-gray-400 mt-1 font-medium">설명 없음</p>
                        </div>
                    </div>
                    <!-- 커넥터 라인 -->
                    <div class="absolute -bottom-16 left-1/2 -translate-x-1/2 h-16 connector-line"></div>
                </div>

                <div class="h-16"></div>

                <!-- [노드 2] 마스터 이미지 카드 (샘플 기반 활성화 디자인) -->
                <div class="soft-card master-node-active w-[460px] p-6 relative animate-in zoom-in duration-500">
                    <div class="absolute -top-3 left-1/2 -translate-x-1/2 active-badge flex items-center gap-1.5">
                        <i data-lucide="star" class="w-3 h-3 fill-current"></i> Active
                    </div>

                    <div class="flex items-center justify-between mb-5 px-2">
                        <div class="flex items-center gap-3">
                            <div class="text-pink-500">
                                <i data-lucide="film" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <h3 class="text-lg font-extrabold text-gray-900 tracking-tight">마스터 이미지 1</h3>
                                <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mt-0.5">New
                                    Scene 1</p>
                            </div>
                        </div>
                        <div class="w-10 h-10 rounded-full bg-gray-50 flex items-center justify-center text-gray-300">
                            <i data-lucide="clock" class="w-5 h-5"></i>
                        </div>
                    </div>

                    <!-- 이미지 프리뷰 영역 (샘플과 동일한 레이아웃) -->
                    <div
                        class="aspect-video rounded-2xl bg-gray-50/50 border border-gray-100 flex flex-col items-center justify-center gap-3 mb-6 relative overflow-hidden group">
                        <div class="text-center">
                            <i data-lucide="image" class="w-10 h-10 text-gray-200 mx-auto mb-2"></i>
                            <span class="text-sm font-bold text-gray-300">이미지 없음</span>
                        </div>
                        <div
                            class="absolute inset-0 bg-pink-500/5 opacity-0 group-hover:opacity-100 transition-opacity">
                        </div>
                    </div>

                    <div class="flex flex-col items-center">
                        <p class="text-xs font-bold text-gray-300 mb-4 uppercase tracking-[0.2em]">준비</p>
                        <button
                            class="w-14 h-14 rounded-full btn-pink text-white flex items-center justify-center shadow-xl shadow-pink-100 active:scale-90 transform transition-transform">
                            <i data-lucide="plus" class="w-8 h-8"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 하단 줌 컨트롤 -->
            <div
                class="absolute bottom-8 left-8 flex flex-col gap-1 bg-white p-1 rounded-2xl shadow-xl border border-gray-100">
                <button class="p-3 text-gray-400 hover:text-pink-500 transition-colors"><i data-lucide="plus"
                        class="w-4 h-4"></i></button>
                <div class="h-px bg-gray-50 mx-2"></div>
                <button class="p-3 text-gray-400 hover:text-pink-500 transition-colors"><i data-lucide="minus"
                        class="w-4 h-4"></i></button>
                <div class="h-px bg-gray-50 mx-2"></div>
                <button class="p-3 text-gray-400 hover:text-pink-500 transition-colors"><i data-lucide="maximize"
                        class="w-4 h-4"></i></button>
                <div class="h-px bg-gray-50 mx-2"></div>
                <button class="p-3 text-gray-400 hover:text-pink-500 transition-colors"><i data-lucide="lock"
                        class="w-4 h-4"></i></button>
            </div>
        </main>

        <!-- 오른쪽 사이드바 (샘플 이미지의 구성을 정밀하게 구현) -->
        <aside class="w-[380px] border-l border-gray-100 bg-white flex flex-col shadow-2xl relative z-50">
            <div class="p-8 flex flex-col h-full">
                <div class="flex items-center justify-between mb-10">
                    <h2 class="text-xl font-bold text-gray-900 flex items-center gap-3">
                        <i data-lucide="zap" class="w-5 h-5 text-pink-500 fill-current"></i> 마스터 이미지 생성
                    </h2>
                    <button class="p-2 hover:bg-gray-50 rounded-lg text-gray-300">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>

                <div class="flex-1 overflow-y-auto pr-2 custom-scrollbar space-y-10">
                    <!-- 스타일 섹션 -->
                    <section>
                        <h3
                            class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                            <i data-lucide="palette" class="w-3 h-3"></i> 스타일
                        </h3>
                        <div class="grid grid-cols-2 gap-3">
                            <button
                                class="bento-item p-4 text-center text-sm font-bold border-2 border-pink-500 text-pink-500 bg-pink-50/30">실사</button>
                            <button class="bento-item p-4 text-center text-sm font-medium text-gray-500">애니메이션</button>
                            <button class="bento-item p-4 text-center text-sm font-medium text-gray-500">픽사</button>
                            <button class="bento-item p-4 text-center text-sm font-medium text-gray-500">수채화</button>
                            <button
                                class="bento-item p-4 text-center text-sm font-medium text-gray-500 col-span-2">유화</button>
                        </div>
                    </section>

                    <!-- 시간대 섹션 -->
                    <section>
                        <h3
                            class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                            <i data-lucide="sun" class="w-3 h-3"></i> 시간대
                        </h3>
                        <div class="flex flex-wrap gap-2">
                            <button
                                class="px-4 py-2 rounded-full border border-gray-200 text-xs font-medium text-gray-500 hover:border-pink-200 transition-all">아침</button>
                            <button
                                class="px-4 py-2 rounded-full border border-gray-200 text-xs font-medium text-gray-500 hover:border-pink-200 transition-all">낮</button>
                            <button
                                class="px-5 py-2 rounded-full bg-gray-900 text-white text-xs font-bold shadow-lg">저녁</button>
                            <button
                                class="px-4 py-2 rounded-full border border-gray-200 text-xs font-medium text-gray-500 hover:border-pink-200 transition-all">밤</button>
                        </div>
                    </section>

                    <!-- 등장 인물 -->
                    <section>
                        <h3
                            class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                            <i data-lucide="users" class="w-3 h-3"></i> 등장 오브젝트
                        </h3>
                        <div class="space-y-2">
                            <div class="bento-item p-4 flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="w-4 h-4 rounded border-2 border-pink-500 bg-pink-500 flex items-center justify-center">
                                        <i data-lucide="check" class="w-3 h-3 text-white"></i>
                                    </div>
                                    <span class="text-sm font-bold text-gray-700">나희도</span>
                                </div>
                                <span
                                    class="text-[9px] font-black px-2 py-0.5 rounded bg-pink-50 text-pink-400">캐릭터</span>
                            </div>
                            <div class="bento-item p-4 flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="w-4 h-4 rounded border-2 border-gray-100 group-hover:border-pink-500 transition-colors">
                                    </div>
                                    <span class="text-sm font-bold text-gray-700">백이진</span>
                                </div>
                                <span
                                    class="text-[9px] font-black px-2 py-0.5 rounded bg-pink-50 text-pink-400">캐릭터</span>
                            </div>
                            <div class="bento-item p-4 flex items-center justify-between cursor-pointer group">
                                <div class="flex items-center gap-3">
                                    <div
                                        class="w-4 h-4 rounded border-2 border-gray-100 group-hover:border-pink-500 transition-colors">
                                    </div>
                                    <span class="text-sm font-bold text-gray-700">로봇 벨</span>
                                </div>
                                <span
                                    class="text-[9px] font-black px-2 py-0.5 rounded bg-blue-50 text-blue-400">오브젝트</span>
                            </div>
                        </div>
                    </section>

                    <!-- 분위기 -->
                    <section>
                        <h3
                            class="text-[11px] font-black text-gray-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                            <i data-lucide="smile" class="w-3 h-3"></i> 분위기
                        </h3>
                        <div class="flex flex-wrap gap-2">
                            <button
                                class="px-4 py-2 rounded-xl border border-gray-100 bg-gray-50/50 text-xs text-gray-500 font-bold hover:bg-white hover:border-pink-200">#편안</button>
                            <button
                                class="px-4 py-2 rounded-xl border border-pink-200 bg-pink-50/50 text-xs text-pink-500 font-bold">#고독</button>
                            <button
                                class="px-4 py-2 rounded-xl border border-gray-100 bg-gray-50/50 text-xs text-gray-500 font-bold">#긴장</button>
                            <button
                                class="px-4 py-2 rounded-xl border border-gray-100 bg-gray-50/50 text-xs text-gray-500 font-bold">#행복</button>
                        </div>
                    </section>
                </div>

                <!-- 하단 액션 버튼 (샘플 버튼의 강화판) -->
                <div class="mt-8 pt-8 border-t border-gray-50 flex flex-col gap-3">
                    <button
                        class="w-full py-4 rounded-2xl border border-gray-100 bg-white text-gray-600 text-sm font-bold flex items-center justify-center gap-2 hover:bg-gray-50 transition-all">
                        <i data-lucide="sparkles" class="w-4 h-4 text-pink-400"></i> 프롬프트 생성
                    </button>
                    <button
                        class="w-full py-5 rounded-2xl btn-pink text-white font-bold flex items-center justify-center gap-2 shadow-xl shadow-pink-100">
                        <i data-lucide="image" class="w-5 h-5"></i> 이미지 생성
                    </button>
                </div>
            </div>
        </aside>
    </div>

    <!-- 푸터: 샘플 디자인의 디테일을 정밀하게 재현 -->
    <footer class="h-10 bg-white border-t border-gray-100 flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <i data-lucide="star" class="w-3.5 h-3.5 text-pink-500 fill-current"></i>
                <span class="text-[10px] font-bold text-pink-500 uppercase tracking-widest">Confirmed</span>
            </div>
            <p class="text-[10px] font-medium text-gray-300">확정된 클립이 없습니다</p>
        </div>
        <div class="flex items-center gap-4 text-gray-300">
            <i data-lucide="share-2" class="w-4 h-4 hover:text-pink-500 cursor-pointer transition-colors"></i>
            <i data-lucide="play" class="w-4 h-4 hover:text-pink-500 cursor-pointer transition-colors"></i>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
