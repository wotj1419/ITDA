<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Movie Studio</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
    <link rel="stylesheet" href="../assets/css/components/form.css">
    <link rel="stylesheet" href="../assets/css/components/toast.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">

    <!-- Decorative Background -->
    <div
        style="position: fixed; top: -20%; left: -10%; width: 500px; height: 500px; background: var(--rose-200); border-radius: 50%; filter: blur(100px); opacity: 0.5; z-index: -1;">
    </div>
    <div
        style="position: fixed; bottom: -20%; right: -10%; width: 600px; height: 600px; background: var(--rose-300); border-radius: 50%; filter: blur(120px); opacity: 0.4; z-index: -1;">
    </div>

    <main style="width: 100%; max-width: 420px; padding: 2rem;">

        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <div
                style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--rose-400), var(--rose-500)); border-radius: 12px; margin: 0 auto 1rem;">
            </div>
            <h1 class="h2">AI Movie Studio</h1>
            <p class="text-muted text-sm">Turn your ideas into AI-generated films</p>
        </div>

        <!-- Auth Card -->
        <div class="card" style="padding: 2rem;">

            <!-- Tabs -->
            <div class="tabs" style="margin-bottom: 1.5rem;">
                <button class="tab active" data-auth-tab="login">로그인</button>
                <button class="tab" data-auth-tab="register">회원가입</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label class="form-label required">이메일</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="mail" class="w-5 h-5 input-icon"></i>
                        <input type="email" class="form-input" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">비밀번호</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="lock" class="w-5 h-5 input-icon"></i>
                        <input type="password" class="form-input" placeholder="••••••••" required
                            style="padding-right: 2.5rem;">
                        <button type="button" class="input-icon-right" data-toggle-password
                            style="background: none; border: none; cursor: pointer;">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="form-check">
                        <input type="checkbox" class="form-checkbox">
                        <span class="form-check-label">로그인 상태 유지</span>
                    </label>
                    <a href="#" style="font-size: 0.75rem; color: var(--rose-500); text-decoration: none;">비밀번호
                        찾기</a>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg">
                    로그인
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>

            <!-- Register Form (hidden by default) -->
            <form id="register-form" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label required">이름</label>
                    <input type="text" class="form-input" placeholder="홍길동" required>
                </div>

                <div class="form-group">
                    <label class="form-label required">이메일</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="mail" class="w-5 h-5 input-icon"></i>
                        <input type="email" class="form-input" placeholder="your@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label required">비밀번호</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="lock" class="w-5 h-5 input-icon"></i>
                        <input type="password" class="form-input" placeholder="8자 이상 입력" required
                            style="padding-right: 2.5rem;">
                        <button type="button" class="input-icon-right" data-toggle-password
                            style="background: none; border: none; cursor: pointer;">
                            <i data-lucide="eye" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="form-helper">영문, 숫자 포함 8자 이상</div>
                </div>

                <div class="form-group">
                    <label class="form-label required">비밀번호 확인</label>
                    <input type="password" class="form-input" placeholder="비밀번호 재입력" required>
                </div>

                <div class="form-group mb-6">
                    <label class="form-check">
                        <input type="checkbox" class="form-checkbox" required>
                        <span class="form-check-label"><a href="#"
                                style="color: var(--rose-500); text-decoration: none;">이용약관</a> 및 <a href="#"
                                style="color: var(--rose-500); text-decoration: none;">개인정보처리방침</a>에 동의합니다</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary w-full btn-lg">
                    회원가입
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </form>

            <!-- Divider -->
            <div class="form-divider">
                <span>또는</span>
            </div>

            <!-- Social Login -->
            <button class="btn btn-secondary w-full" style="margin-bottom: 0.75rem;" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4"
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                    <path fill="#34A853"
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                    <path fill="#FBBC05"
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                    <path fill="#EA4335"
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                </svg>
                Google로 계속하기 (P1)
            </button>
        </div>

        <!-- Footer -->
        <p class="text-muted text-xs" style="text-align: center; margin-top: 2rem;">
            © 2026 AI Movie Studio. All rights reserved.
        </p>
    </main>

    <script src="../assets/js/ui.js"></script>
    <script>
        lucide.createIcons();
        // Auth Tab Switching
        document.querySelectorAll('[data-auth-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabId = tab.getAttribute('data-auth-tab');

                // Update tabs
                document.querySelectorAll('[data-auth-tab]').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update forms
                document.querySelectorAll('.auth-form').forEach(form => {
                    form.style.display = form.id === `${tabId}-form` ? 'block' : 'none';
                });
            });
        });

        // Form Submit (Demo)
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            window.location.href = 'dashboard.html';
        });

        document.getElementById('register-form').addEventListener('submit', (e) => {
            e.preventDefault();
            Toast.success('회원가입 완료', '환영합니다! 로그인해주세요.');
            document.querySelector('[data-auth-tab="login"]').click();
        });
    </script>
</body>

</html>
